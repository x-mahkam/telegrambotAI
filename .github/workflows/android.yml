name: Android app

on:
  push:
    paths: ["android-app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (analysis) and debug APK
        run: ./gradlew :analysis:test :app:assembleDebug --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: MonitorCheck-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-test-reports
          path: android-app/analysis/build/reports/tests/test/
